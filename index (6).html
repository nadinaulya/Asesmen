<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asesmen Sumatif · Teks Eksplanasi</title>
<style>
:root{--ink:#14213d;--sub:#5b6478;--line:#d9dee8;--bg:#f4f6fa;--card:#fff;--ac:#0b6e8a;--acl:#e3f1f5;--ok:#16794c;--bad:#b3261e;--warn:#fff4d6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));user-select:none;-webkit-user-select:none}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.hr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px}
.hr b{font-size:15px;letter-spacing:.2px}
#tm{font-variant-numeric:tabular-nums;font-size:13px;opacity:.85}
#net{display:flex;align-items:center;gap:6px;font-size:12px;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 10px}
#net i{width:8px;height:8px;border-radius:50%;background:#3ddc84}
#net.off i{background:#ff6b6b;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
.pb{height:4px;background:rgba(255,255,255,.2);margin:0 -16px}
#bar{height:100%;width:0;background:#6fd3e8;transition:width .3s}
#offb{display:none;background:#b3261e;color:#fff;font-size:13px;padding:8px 16px;text-align:center}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.meta{font-size:13px;color:var(--ac);font-weight:600;margin-bottom:8px}
.q{font-size:17px;margin:0 0 14px;font-weight:600}
h1{font-size:22px;margin:0 0 6px}
p{margin:0 0 10px}
.hint{font-size:13px;color:var(--sub)}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer;min-height:48px}
.opt b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opt.on{border-color:var(--ac);background:var(--acl)}
.opt.on b{background:var(--ac);color:#fff}
input,textarea{width:100%;font:inherit;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px;background:#fff;user-select:text;-webkit-user-select:text}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
textarea{min-height:130px;resize:vertical}
ul.rl{margin:10px 0 14px;padding-left:20px;font-size:14px;color:var(--sub)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 20px;cursor:pointer;min-height:48px}
.pri{background:var(--ac);color:#fff}
.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
nav .btn{flex:1;max-width:300px}
.bank{position:sticky;top:76px;z-index:5;background:var(--card);border:1px dashed var(--ac);border-radius:10px;padding:8px;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.st{background:var(--bg);border-left:3px solid var(--ac);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:15px;line-height:1.6}
.chip{touch-action:none;display:flex;gap:8px;align-items:center;background:var(--acl);border:1.5px solid var(--ac);border-radius:8px;padding:8px 10px;font-size:14px;cursor:grab}
.chip b{background:var(--ac);color:#fff;border-radius:5px;padding:0 7px}
.chip.sel{background:var(--ac);color:#fff}
.chip.sel b{background:#fff;color:var(--ac)}
.jd{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.slot{min-height:48px;border:2px dashed var(--line);border-radius:10px;padding:5px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px}
.slot.f{border-style:solid;border-color:var(--ac);justify-content:flex-start}
.slot.hv{background:var(--acl);border-color:var(--ac)}
.gh{position:fixed;z-index:99;pointer-events:none;opacity:.9;width:220px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;z-index:50;background:rgba(20,33,61,.82);display:grid;place-items:center;padding:20px}
.md{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%}
.md h2{margin:0 0 8px;font-size:19px}
.md .btn{width:100%;margin-top:8px}
.warn{background:var(--warn);border:1px solid #ecd48a;border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
.ct{text-align:center}
.ck{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:6px auto 14px}
.rb{font-size:13px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px;margin:8px 0 10px}
</style>
</head>
<body>
<header>
  <div class="hr"><b>Asesmen Sumatif · Teks Eksplanasi</b><span id="tm"></span><div id="net"><i></i><span>Online</span></div></div>
  <div class="pb"><div id="bar"></div></div>
</header>
<div id="offb">Kamu sedang offline. Jawaban tetap tersimpan di perangkat, tetapi hanya bisa dikirim saat online.</div>
<main id="app"></main>
<nav id="nav"></nav>

<script>
// ====== PENGATURAN ======
const URL_SCRIPT = 'GANTI_DENGAN_URL_WEB_APP_ANDA'; // URL deploy Google Apps Script (berakhiran /exec)
const MAXV = 3; // batas pelanggaran sebelum jawaban dikirim otomatis

// ====== SOAL ======
const PG = [
 ['Bacalah kutipan teks berikut!<br><i>"Kebakaran hutan di kawasan pegunungan Tela dipicu oleh menumpuknya serasah daun kering selama musim kemarau yang diperparah oleh tiupan angin lembah yang kencang. Akibatnya, percikan api kecil dengan cepat merambat membakar vegetasi di lereng bukit."</i>',
  'Hubungan kausalitas (sebab-akibat) yang dijelaskan dalam kutipan tersebut adalah...',
  ['Tiupan angin kencang menyebabkan musim kemarau berlangsung lebih lama.','Tumpukan serasah kering dan angin lembah mempercepat rambatan api di lereng bukit.','Vegetasi lereng bukit menghasilkan angin lembah yang memadamkan percikan api.','Musim kemarau terjadi akibat warga membakar serasah daun di pegunungan.','Percikan api kecil menghentikan tiupan angin kencang di kawasan Tela.']],
 ['Cermati kalimat rumpang berikut!<br><i>"Penggunaan AI generatif secara instan tanpa membaca ulang sumber asli membuat pelajar melewatkan proses sintesis informasi, [...] kemampuan analisis mendalam mereka melemah."</i>',
  'Konjungsi kausalitas yang paling tepat untuk melengkapi bagian rumpang tersebut adalah...',
  ['meskipun','sehingga','padahal','melainkan','sedangkan']],
 ['Perhatikan dua pernyataan berikut!<br><b>Pernyataan 1:</b> <i>"Suhu udara yang tinggi disertai rendahnya kelembapan relatif menurunkan kadar air pada tumbuhan sehingga vegetasi menjadi mudah terbakar."</i><br><b>Pernyataan 2:</b> <i>"Kebakaran di bukit itu pasti terjadi karena alam sedang marah melihat perilaku manusia zaman sekarang."</i>',
  'Evaluasi paling tepat berdasarkan kaidah penulisan teks eksplanasi kompleks adalah...',
  ['Pernyataan 1 layak digunakan karena menjelaskan mekanisme alam secara objektif dan berbasis istilah ilmiah.','Pernyataan 2 layak digunakan karena menyentuh perasaan pembaca agar menjaga alam.','Keduanya layak digunakan karena sama-sama membahas peristiwa kebakaran hutan.','Keduanya tidak layak digunakan karena tidak mencantumkan wawancara saksi mata.','Pernyataan 2 lebih tepat karena menggunakan gaya bahasa majas yang indah.']],
 ['Bacalah kutipan teks berikut!<br><i>"Kebiasaan menyalin jawaban atau ringkasan langsung dari AI tanpa membaca sumber asli membuat proses <b>sintesis informasi</b> di dalam otak terlewati."</i>',
  'Makna istilah teknis <b>sintesis informasi</b> dalam konteks kalimat di atas adalah...',
  ['Tindakan menyalin teks dari internet secara utuh tanpa mengubah kata','Proses menggabungkan dan mengolah berbagai sumber informasi menjadi pemahaman baru yang utuh','Proses penghapusan riwayat pencarian pada aplikasi kecerdasan buatan','Gangguan jaringan saat aplikasi sedang memproses perintah pengguna','Kemampuan komputer menyimpan jutaan dokumen dalam server pusat']],
 ['Perhatikan kalimat-kalimat acak berikut!<br>(1) Akibatnya, api dengan cepat merambat mengikuti arah angin lembah dan kemiringan lereng yang curam.<br>(2) Kebakaran di kawasan Tela bermula dari kombinasi kemarau panjang dan penumpukan biomassa kering di permukaan tanah.<br>(3) Kondisi vegetasi yang kering tersebut kemudian tersulut oleh adanya sumber percikan api di permukaan.<br>(4) Rambatan api yang luas itu berdampak pada rusaknya ekosistem lereng serta lapisan humus penyimpan air tanah.',
  'Urutan rangkaian <i>Deretan Penjelas</i> yang paling logis dan kronologis adalah...',
  ['(2) – (1) – (3) – (4)','(3) – (2) – (1) – (4)','(2) – (3) – (1) – (4)','(1) – (2) – (4) – (3)','(4) – (3) – (2) – (1)']],
 ['', 'Manakah kalimat berikut yang menunjukkan hubungan kausalitas (sebab-akibat) secara eksplisit?',
  ['Siswa kelas XI sedang berdiskusi kelompok menggunakan laptop di perpustakaan sekolah.','Rendahnya kelembapan relatif pada musim kemarau menurunkan kadar air tumbuhan sehingga vegetasi mudah terbakar.','Teknologi kecerdasan buatan berkembang sangat pesat dalam lima tahun terakhir di berbagai negara.','Petugas kehutanan melakukan patroli rutin di kawasan perbukitan setiap pagi hari.','Banyak pelajar menggunakan ponsel pintar untuk mengakses materi pembelajaran daring.']],
 ['Bacalah kutipan teks berikut!<br><i>"Kebiasaan pelajar menyalin jawaban langsung dari AI tanpa proses berpikir mandiri memicu fenomena <b>cognitive offloading</b>. Otak terbiasa mengandalkan alat eksternal untuk menyimpan dan mengolah informasi, akibatnya daya ingat jangka panjang dan ketajaman logika menurun."</i>',
  'Hubungan sebab-akibat utama yang dijelaskan dalam paragraf tersebut adalah...',
  ['Penurunan daya ingat membuat pelajar menciptakan aplikasi AI baru.','Kebiasaan menyalin jawaban AI secara instan memicu cognitive offloading yang menurunkan ketajaman logika.','Cognitive offloading meningkatkan kemampuan otak pelajar dalam menghafal materi ujian.','Penggunaan alat eksternal mempercepat kerja sel saraf otak saat ujian tertulis.','Pelajar yang memiliki daya ingat kuat tidak pernah menggunakan teknologi digital.']],
 ['', 'Ciri kebahasaan yang wajib dihindari saat mengonstruksi bagian <i>Deretan Penjelas</i> teks eksplanasi kompleks adalah...',
  ['Penggunaan konjungsi kausalitas seperti akibatnya dan memicu','Penggunaan istilah ilmiah sesuai bidang fenomena yang dibahas','Kalimat seruan emosional, ajakan subjektif, dan rumor tanpa dasar data','Kata kerja material yang menggambarkan proses perubahan fisik atau kognitif','Pola pengembangan paragraf dari sebab umum menuju akibat khusus']],
 ['Bacalah paragraf penutup (<i>Interpretasi</i>) berikut!<br><i>"Dengan demikian, kebakaran di kawasan Tela bukanlah peristiwa tunggal, melainkan akumulasi dari kekeringan vegetasi, topografi lereng, dan pemicu api di permukaan. Pengawasan aktivitas warga serta pembersihan jalur sekat bakar menjadi langkah mitigasi yang krusial saat musim kemarau tiba."</i>',
  'Fungsi kalimat kedua dalam kutipan interpretasi tersebut adalah...',
  ['Menjelaskan definisi awal dari biomassa kering','Memberikan simpulan implikasi atau langkah mitigasi rasional berdasarkan fenomena yang telah dijelaskan','Memulai rantai sebab-akibat baru tentang terjadinya tanah longsor','Membantah fakta ilmiah mengenai faktor cuaca kemarau','Menyebutkan daftar nama petugas pemadam kebakaran di lapangan']],
 ['', 'Saat mengonstruksi teks eksplanasi kompleks dari sekumpulan data kasus, langkah paling tepat pada bagian <i>Deretan Penjelas</i> adalah...',
  ['Menuliskan seluruh data secara acak tanpa kata penghubung','Mengurutkan tahapan proses mulai dari faktor pemicu, mekanisme perubahan, hingga dampak yang ditimbulkan secara kronologis dan kausal','Menambahkan cerita fiksi agar pembaca tidak bosan membaca data ilmiah','Menyimpulkan pendapat pribadi di setiap awal kalimat','Menghapus semua istilah teknis agar tulisan menjadi sangat pendek']]
];
const TERM = ['Biomassa Kering','Sintesis Informasi','Cognitive Offloading','Deretan Penjelas','Konjungsi Kausalitas'];
const MEAN = {
 A:'Kecenderungan melimpahkan beban kerja mental otak (mengingat dan menganalisis) ke perangkat digital sehingga daya analisis berkurang.',
 B:'Bagian inti teks eksplanasi yang merangkai urutan proses sebab → akibat terjadinya fenomena secara logis dan berantai.',
 C:'Tumpukan material organik seperti serasah daun dan ranting gugur yang mudah terbakar saat musim kemarau.',
 D:'Kata hubung seperti akibatnya, memicu, sehingga, dan oleh karena itu yang mengikat hubungan sebab dan akibat antarkalimat.',
 E:'Proses menggabungkan dan mengolah berbagai gagasan dari sumber bacaan menjadi pemahaman baru secara mandiri.'
};
const UR = [
 ['Membuat kalimat pembuka (Pernyataan Umum)', 'Tuliskan 2 kalimat pembuka untuk mengenalkan topik "Kebakaran Hutan di Kawasan Tela" secara singkat dan jelas!'],
 ['Melengkapi kalimat sebab-akibat (Deretan Penjelas)', 'Susunlah 2–3 kalimat yang menjelaskan penyebab terjadinya kebakaran di kawasan Tela (misalnya karena cuaca panas, daun kering, dan angin kencang) menggunakan kata penghubung karena atau akibatnya!'],
 ['Membuat kalimat pembuka (Pernyataan Umum, topik AI)', 'Tuliskan 2 kalimat pembuka yang mengenalkan kebiasaan "Pelajar SMA Menggunakan AI untuk Mengerjakan Tugas" secara netral (bukan kalimat marah atau larangan)!'],
 ['Menjelaskan akibat (Deretan Penjelas, topik AI)', 'Tuliskan 2–3 kalimat yang menjelaskan dampak negatif jika pelajar terlalu sering menyalin jawaban AI tanpa membaca dan berpikir sendiri! Gunakan kata sehingga atau membuat.'],
 ['Membuat kalimat penutup (Interpretasi)', 'Tuliskan 1–2 kalimat penutup yang berisi kesimpulan dan saran bijak bagi pelajar dalam menggunakan AI!']
];
const L = ['A','B','C','D','E'], TOTAL = 12, SK = 'asesmen_eksplanasi_v2';

// ====== STATE ======
const $ = id => document.getElementById(id);
let s = null, sel = null, lastV = 0;
try { s = JSON.parse(localStorage.getItem(SK)); } catch(e) {}
const save = () => { try { localStorage.setItem(SK, JSON.stringify(s)); } catch(e) {} };
const clr = () => { try { localStorage.removeItem(SK); } catch(e) {} };

// ====== MODAL ======
function modal(h, btns) {
  const o = document.createElement('div'); o.className = 'ov';
  o.innerHTML = '<div class="md">' + h + '</div>';
  btns.forEach(b => { const x = document.createElement('button'); x.className = 'btn ' + (b.c || 'pri'); x.textContent = b.t; x.onclick = () => { o.remove(); b.f && b.f(); }; o.firstChild.appendChild(x); });
  document.body.appendChild(o);
}

// ====== ONLINE / TIMER ======
function net() {
  const on = navigator.onLine, n = $('net');
  n.className = on ? '' : 'off'; n.lastChild.textContent = on ? 'Online' : 'Offline';
  $('offb').style.display = on ? 'none' : 'block';
  if (on && s && s.final && !s.sent && !s.busy) submit(); // kirim ulang otomatis
}
addEventListener('online', net); addEventListener('offline', net);
setInterval(() => {
  if (!s || !s.mulai || s.sent) { $('tm').textContent = ''; return; }
  const t = Math.floor(((s.selesai || Date.now()) - s.mulai) / 1000);
  $('tm').textContent = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}, 1000);

// ====== ANTI KELUAR ======
function viol(why) {
  if (!s || !s.mulai || s.final) return;
  if (Date.now() - lastV < 1500) return; lastV = Date.now();
  s.viol++; s.log.push(new Date().toLocaleTimeString('id-ID') + ' ' + why); save();
  if (s.viol >= MAXV) { modal('<h2>Batas pelanggaran tercapai</h2><p>Kamu meninggalkan halaman sebanyak ' + MAXV + ' kali. Jawabanmu dikirim otomatis ke guru.</p>', [{t:'Mengerti'}]); submit(true); return; }
  modal('<h2>Peringatan ' + s.viol + ' dari ' + MAXV + '</h2><p>Kamu terdeteksi meninggalkan halaman asesmen. Tetap di halaman ini sampai selesai. Pelanggaran ke-' + MAXV + ' akan mengirim jawabanmu otomatis dan dicatat guru.</p>', [{t:'Kembali mengerjakan'}]);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) viol('Pindah tab/aplikasi'); });
addEventListener('blur', () => viol('Jendela tidak aktif'));
addEventListener('beforeunload', e => { if (s && s.mulai && !s.sent) { e.preventDefault(); e.returnValue = ''; } });
history.pushState(null, '', location.href);
addEventListener('popstate', () => { history.pushState(null, '', location.href); viol('Menekan tombol kembali'); });
['contextmenu', 'copy', 'cut', 'dragstart'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('paste', e => e.preventDefault());

// ====== TAMPILAN ======
function intro() {
  $('bar').style.width = '0';
  $('app').innerHTML = '<div class="card"><h1>Asesmen Sumatif Mandiri</h1><p class="hint">Teks Eksplanasi Kompleks · Kelas XI</p>'
   + '<label for="nm">Nama lengkap</label><input id="nm" autocomplete="off" placeholder="Tulis nama lengkapmu">'
   + '<label for="kl">Kelas</label><input id="kl" autocomplete="off" placeholder="Contoh: XI-1">'
   + '<div class="warn"><b>Aturan pengerjaan</b><ul class="rl" style="margin:6px 0 0"><li>Wajib <b>online</b> agar jawaban terkirim ke guru.</li><li>Dilarang berpindah tab, membuka aplikasi lain, atau keluar dari halaman.</li><li>Pelanggaran dicatat. Pelanggaran ke-' + MAXV + ' mengirim jawabanmu otomatis.</li><li>Soal: 10 pilihan ganda, 5 menjodohkan, 5 uraian.</li></ul></div></div>';
  $('nav').innerHTML = '<button class="btn pri" id="go">Mulai mengerjakan</button>';
  $('go').onclick = () => {
    const nm = $('nm').value.trim(), kl = $('kl').value.trim();
    if (nm.length < 3 || !kl) return modal('<h2>Data belum lengkap</h2><p>Isi nama lengkap dan kelas terlebih dahulu.</p>', [{t:'Oke'}]);
    if (!navigator.onLine) return modal('<h2>Kamu offline</h2><p>Sambungkan internet terlebih dahulu sebelum memulai.</p>', [{t:'Oke'}]);
    s = {id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), nama: nm, kelas: kl, mulai: Date.now(), pg: Array(10).fill(''), jd: {}, ur: Array(5).fill(''), step: 0, viol: 0, log: []};
    save();
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch(e) {}
    render();
  };
}

function chip(k) { k = String(k); return '<div class="chip' + (sel === k ? ' sel' : '') + '" data-k="' + k + '"><b>' + (+k + 1) + '</b><span>' + TERM[k] + '</span></div>'; }

function render() {
  if (!s) return intro();
  if (s.final) return sending();
  const st = s.step, a = $('app');
  $('bar').style.width = (st / TOTAL * 100) + '%';
  if (st < 10) {
    const [stim, q, o] = PG[st];
    a.innerHTML = '<div class="card"><div class="meta">Bagian A · Pilihan ganda · Soal ' + (st + 1) + ' dari 10</div>' + (stim ? '<div class="st">' + stim + '</div>' : '') + '<p class="q">' + q + '</p>'
      + o.map((x, k) => '<button class="opt' + (s.pg[st] === L[k] ? ' on' : '') + '" data-l="' + L[k] + '"><b>' + L[k] + '</b><span>' + x + '</span></button>').join('') + '</div>';
    a.querySelectorAll('.opt').forEach(b => b.onclick = () => { s.pg[st] = b.dataset.l; save(); a.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b)); });
  } else if (st === 10) {
    const used = Object.keys(s.jd), bank = TERM.map((_, k) => String(k)).filter(k => !used.includes(k));
    a.innerHTML = '<div class="card"><div class="meta">Bagian B · Menjodohkan istilah dan maknanya</div><p class="hint">Seret istilah ke kotak di bawah makna yang sesuai, atau ketuk istilah lalu ketuk kotaknya. Ketuk istilah yang sudah terpasang untuk melepasnya.</p>'
      + '<div class="bank" id="bank">' + (bank.map(chip).join('') || '<span class="hint">Semua istilah sudah dipasang</span>') + '</div>'
      + Object.keys(MEAN).map(l => { const k = used.find(j => s.jd[j] === l); return '<div class="jd"><p><b>' + l + '.</b> ' + MEAN[l] + '</p><div class="slot' + (k !== undefined ? ' f' : '') + '" data-i="' + l + '">' + (k !== undefined ? chip(k) : 'Kotak istilah') + '</div></div>'; }).join('') + '</div>';
    a.querySelectorAll('.slot').forEach(sl => sl.onclick = () => { if (!sl.querySelector('.chip') && sel !== null) place(sel, sl.dataset.i); });
  } else {
    a.innerHTML = '<div class="card"><div class="meta">Bagian C · Uraian konstruksi (dinilai guru)</div><p class="hint">Tulis dengan kalimat baku dan objektif, dengan alur sebab-akibat yang runtut. Guru menilai dengan skor 0–4 untuk tiap soal.</p></div>'
      + UR.map((q, i) => '<div class="card"><div class="meta">Soal uraian ' + (i + 1) + '</div><p class="q">' + q[0] + '</p><p>' + q[1] + '</p><textarea data-i="' + i + '" placeholder="Tulis jawabanmu di sini"></textarea></div>').join('');
    a.querySelectorAll('textarea').forEach(t => { t.value = s.ur[t.dataset.i]; t.oninput = () => { s.ur[t.dataset.i] = t.value; save(); }; });
  }
  $('nav').innerHTML = '<button class="btn sec" id="pv"' + (st === 0 ? ' disabled' : '') + '>Sebelumnya</button><button class="btn pri" id="nx">' + (st === TOTAL - 1 ? 'Kirim jawaban' : 'Selanjutnya') + '</button>';
  $('pv').onclick = () => go(st - 1);
  $('nx').onclick = () => st === TOTAL - 1 ? confirmSend() : go(st + 1);
}
function go(n) { s.step = n; save(); scrollTo(0, 0); render(); }

// ====== MENJODOHKAN: KLIK + SERET ======
function place(k, l) {
  Object.keys(s.jd).forEach(j => { if (s.jd[j] === l) delete s.jd[j]; });
  s.jd[k] = l; sel = null; save(); render();
}
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const k = c.dataset.k, sx = e.clientX, sy = e.clientY; let gh = null, hv = null;
  const mv = ev => {
    if (!gh && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) { gh = c.cloneNode(true); gh.classList.add('gh'); document.body.appendChild(gh); }
    if (!gh) return;
    gh.style.left = (ev.clientX - 110) + 'px'; gh.style.top = (ev.clientY - 28) + 'px';
    const t = document.elementFromPoint(ev.clientX, ev.clientY), sl = t && t.closest('.slot');
    if (hv && hv !== sl) hv.classList.remove('hv'); hv = sl; if (sl) sl.classList.add('hv');
  };
  const up = ev => {
    removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    if (gh) {
      const t = document.elementFromPoint(ev.clientX, ev.clientY), sl = t && t.closest('.slot'); gh.remove();
      if (sl && ev.type === 'pointerup') place(k, sl.dataset.i); else render();
    } else if (c.closest('.slot')) { delete s.jd[k]; save(); render(); }
    else { sel = sel === k ? null : k; render(); }
  };
  addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
});

// ====== KIRIM ======
function confirmSend() {
  const kosong = [];
  s.pg.forEach((v, i) => { if (!v) kosong.push('PG ' + (i + 1)); });
  TERM.forEach((_, i) => { if (!s.jd[i]) kosong.push('Jodoh ' + (i + 1)); });
  s.ur.forEach((v, i) => { if (!v.trim()) kosong.push('Uraian ' + (i + 1)); });
  if (!navigator.onLine) return modal('<h2>Kamu offline</h2><p>Sambungkan internet lalu tekan Kirim jawaban lagi. Jawabanmu aman di perangkat.</p>', [{t:'Oke'}]);
  modal('<h2>Kirim jawaban?</h2><p>' + (kosong.length ? 'Belum terjawab: <b>' + kosong.join(', ') + '</b>. ' : 'Semua soal sudah terjawab. ') + 'Setelah dikirim, jawaban tidak bisa diubah.</p>', [{t:'Ya, kirim', f: () => submit()}, {t:'Periksa lagi', c:'sec'}]);
}
function sending(msg) {
  $('bar').style.width = '100%'; $('nav').innerHTML = '';
  $('app').innerHTML = '<div class="card ct"><h1>Mengirim jawaban…</h1><p class="hint">' + (msg || 'Jangan tutup halaman ini.') + '</p></div>';
}
async function submit(auto) {
  if (s.busy || s.sent) return;
  s.final = true; s.selesai = s.selesai || Date.now(); s.auto = s.auto || !!auto; s.busy = true; save(); sending();
  const p = {id: s.id, nama: s.nama, kelas: s.kelas, mulai: s.mulai, selesai: s.selesai, viol: s.viol, log: s.log, auto: s.auto, pg: s.pg, jd: [0, 1, 2, 3, 4].map(i => s.jd[i] || ''), ur: s.ur};
  try {
    const r = await fetch(URL_SCRIPT, {method: 'POST', body: JSON.stringify(p)});
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'gagal');
    s.sent = true; s.busy = false; clr(); try { document.fullscreenElement && document.exitFullscreen(); } catch(e) {}
    $('app').innerHTML = '<div class="card ct"><div class="ck">✓</div><h1>Jawaban terkirim</h1><p>Terima kasih, ' + s.nama.replace(/[<>&]/g, '') + '.</p>' + (j.skor != null ? '<p>Skor otomatis (PG + menjodohkan): <b>' + j.skor + ' dari 50</b></p>' : '') + '<p class="hint">Soal uraian akan dinilai oleh guru. Kamu boleh menutup halaman ini.</p></div>';
    $('tm').textContent = '';
  } catch (e) {
    s.busy = false; save();
    $('app').innerHTML = '<div class="card ct"><h1>Belum terkirim</h1><p>Jawabanmu masih tersimpan di perangkat. Pastikan internet aktif, lalu coba kirim ulang. Jangan menutup atau memuat ulang halaman.</p></div>';
    $('nav').innerHTML = '<button class="btn pri" id="rt">Kirim ulang</button>'; $('rt').onclick = () => submit();
  }
}

// ====== MULAI ======
net();
if (s && s.mulai && !s.sent) {
  if (s.final) { sending(); submit(); }
  else { render(); viol('Memuat ulang halaman'); }
} else { s = null; intro(); }
</script>
</body>
